<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Elchim - التطبيق الفاخر</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        body { background: linear-gradient(135deg, #0b0914, #2a113b, #0f2027, #3a1c2a, #0b0914); background-size: 400% 400%; animation: aurora 15s ease infinite; color: #e6e6e6; font-family: 'Times New Roman', Times, serif; margin: 0; padding-bottom: 80px; min-height: 100vh; }
        
        .brand-logo { max-width: 180px; height: auto; mix-blend-mode: screen; filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4)); margin-bottom: 10px; }
        .gold-text { color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        .gold-border { border: 1px solid #d4af37; }
        .gold-btn { background: linear-gradient(45deg, #d4af37, #f3e5ab, #d4af37); color: #0b0914; font-weight: bold; border: none; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); transition: all 0.3s ease; }
        .gold-btn:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(212, 175, 55, 0.6); color: #000;}
        .glass-card { background: rgba(15, 10, 25, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 5, 15, 0.9); backdrop-filter: blur(10px); border-top: 1px solid rgba(212, 175, 55, 0.4); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { text-align: center; color: #888; cursor: pointer; transition: all 0.3s; flex: 1; }
        .nav-item i { font-size: 1.5rem; display: block; margin-bottom: 4px; }
        .nav-item span { font-size: 0.75rem; }
        .nav-item.active { color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.8); transform: translateY(-3px); }
        .app-screen { display: none; animation: fadeIn 0.5s; }
        .app-screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .royal-response { background: linear-gradient(180deg, rgba(212, 175, 55, 0.1) 0%, rgba(0,0,0,0) 100%); border-top: 2px solid #d4af37; border-bottom: 2px solid #d4af37; padding: 20px; font-size: 1.1rem; line-height: 1.8; margin-top: 20px; white-space: pre-line; position: relative; }
        .preview-img { max-width: 100%; max-height: 150px; object-fit: contain; border-radius: 8px; border: 1px solid #d4af37; margin-top: 10px; }
        
        .input-toolbar { display: flex; gap: 15px; margin-top: -15px; margin-bottom: 15px; justify-content: flex-end; padding-left: 10px; }
        .icon-btn { background: none; border: none; color: #d4af37; font-size: 1.4rem; cursor: pointer; transition: 0.3s; padding: 0; }
        .icon-btn:hover { color: #fff; transform: scale(1.1); }
        .recording { color: #ff4d4d; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        
        .play-voice-btn { background: #d4af37; color: #0b0914; border: none; border-radius: 5px; padding: 5px 15px; font-weight: bold; margin-top: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .play-voice-btn:hover { background: #f3e5ab; }
    </style>
</head>
<body>

    <div class="container pt-4 pb-2 text-center">
        <img src="logo.jpg" alt="Royal Elchim" class="brand-logo">
        <p class="small text-muted" id="quotaDisplay">جمال يترك أثراً، وحضور يولد الحب</p>
    </div>

    <div class="container">
        <!-- القراءة -->
        <div id="screen-diagnosis" class="app-screen active">
            <div class="glass-card">
                <h3 class="gold-text mb-3 text-center"><i class="fa-solid fa-eye"></i> قراءة الروح</h3>
                <div class="mb-3">
                    <label class="gold-text">الحدث (طاقتكِ الحالية):</label>
                    <select id="qMood" class="form-select bg-dark text-light border-secondary">
                        <option value="استعد لحدث استثنائي وأريد حضوراً يخطف الأنفاس">أستعد لحدث استثنائي وأريد حضوراً يخطف الأنفاس ويولد الانبهار</option>
                        <option value="أريد أن أستكشف جانباً جديداً وغامضاً في شخصيتي">أبحث عن جمال هادئ يترك أثراً لا يُنسى</option>
                    </select>
                </div>
                <button class="btn gold-btn w-100 py-2" onclick="runDiagnosis()">تحليل الهالة <i class="fa-solid fa-wand-magic-sparkles"></i></button>
                <div id="diagResponse" class="royal-response" style="display:none;"></div>
            </div>
        </div>

        <!-- العطور -->
        <div id="screen-perfume" class="app-screen">
            <div class="glass-card">
                <h3 class="gold-text mb-3 text-center"><i class="fa-solid fa-spray-can-sparkles"></i> الأثر العطري</h3>
                <textarea id="perfumeInput" class="form-control bg-dark text-light border-secondary mb-4" rows="3" placeholder="تحدثي عن العطر الذي يعبر عنكِ..."></textarea>
                <div class="input-toolbar">
                    <button class="icon-btn" onclick="startDictation('perfumeInput', this)" title="تحدثي لرويال مايند"><i class="fa-solid fa-microphone"></i></button>
                    <label class="icon-btn" title="رفع ملف نصي للتحليل"><i class="fa-solid fa-paperclip"></i><input type="file" hidden accept=".txt" onchange="handleFileUpload(event, 'perfumeInput')"></label>
                </div>
                <button class="btn gold-btn w-100 py-2" onclick="runChat('perfume', 'perfumeInput', 'perfumeResponse')">ابتكار التوقيع العطري <i class="fa-solid fa-leaf"></i></button>
                <div id="perfumeResponse" class="royal-response" style="display:none;"></div>
            </div>
        </div>

        <!-- المكياج -->
        <div id="screen-makeup" class="app-screen">
            <div class="glass-card">
                <h3 class="gold-text mb-3 text-center"><i class="fa-solid fa-paintbrush"></i> النحت الجمالي</h3>
                <textarea id="makeupInput" class="form-control bg-dark text-light border-secondary mb-4" rows="3" placeholder="صفي لنا ملامحكِ أو الإطلالة التي تطمحين لها..."></textarea>
                <div class="input-toolbar">
                    <button class="icon-btn" onclick="startDictation('makeupInput', this)" title="تحدثي لرويال مايند"><i class="fa-solid fa-microphone"></i></button>
                    <label class="icon-btn" title="رفع ملف نصي للتحليل"><i class="fa-solid fa-paperclip"></i><input type="file" hidden accept=".txt" onchange="handleFileUpload(event, 'makeupInput')"></label>
                </div>
                <button class="btn gold-btn w-100 py-2" onclick="runChat('makeup', 'makeupInput', 'makeupResponse')">استشارة النحت والجمال <i class="fa-solid fa-star"></i></button>
                <div id="makeupResponse" class="royal-response" style="display:none;"></div>
            </div>
        </div>

        <!-- التخيل البصري -->
        <div id="screen-simulation" class="app-screen">
            <div class="glass-card">
                <h3 class="gold-text mb-3 text-center"><i class="fa-solid fa-camera-retro"></i> التخيل الفلسفي</h3>
                <div class="row text-center mb-3">
                    <div class="col-6">
                        <label class="btn btn-outline-warning w-100 p-2" style="border-color:#d4af37; color:#d4af37;"><i class="fa-solid fa-user"></i> وجهكِ<input type="file" hidden accept="image/*" onchange="previewImage(event, 'simSelfiePreview', 'selfieBase64')"></label>
                        <div id="simSelfiePreview"></div>
                    </div>
                    <div class="col-6">
                        <label class="btn btn-outline-warning w-100 p-2" style="border-color:#d4af37; color:#d4af37;"><i class="fa-solid fa-box-open"></i> المنتج<input type="file" hidden accept="image/*" onchange="previewImage(event, 'simProductPreview', 'productBase64')"></label>
                        <div id="simProductPreview"></div>
                    </div>
                </div>
                <input type="text" id="simProductName" class="form-control bg-dark text-light border-secondary mb-3 text-center" placeholder="أدخلي اسم المنتج (مثال: روج عنابي ملكي)">
                <button class="btn gold-btn w-100 py-2" onclick="runSimulation()">تخيل الأثر الجمالي <i class="fa-solid fa-droplet"></i></button>
                <div id="simResponse" class="royal-response" style="display:none;"></div>
            </div>
        </div>

        <!-- السجلات -->
        <div id="screen-vault" class="app-screen">
            <div class="glass-card">
                <h3 class="gold-text mb-3 text-center"><i class="fa-solid fa-book-journal-whills"></i> السجلات الملكية</h3>
                <div id="vaultContainer" style="max-height: 400px; overflow-y: auto;"></div>
            </div>
        </div>

    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('diagnosis', this)"><i class="fa-solid fa-compass"></i><span>القراءة</span></div>
        <div class="nav-item" onclick="switchTab('perfume', this)"><i class="fa-solid fa-spray-can"></i><span>العطور</span></div>
        <div class="nav-item" onclick="switchTab('makeup', this)"><i class="fa-solid fa-lips"></i><span>المكياج</span></div>
        <div class="nav-item" onclick="switchTab('simulation', this)"><i class="fa-solid fa-wand-magic-sparkles"></i><span>التخيل</span></div>
        <div class="nav-item" onclick="switchTab('vault', this)"><i class="fa-solid fa-folder-open"></i><span>السجلات</span></div>
    </div>

    <script>
        const BACKEND_URL = "https://royalmind-api-production-2448.up.railway.app";
        let imagesData = { selfieBase64: null, productBase64: null };

        window.onload = () => { renderVault(); };

        function switchTab(screenId, element) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + screenId).classList.add('active');
            element.classList.add('active');
        }

        function previewImage(event, previewId, dataKey) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function() {
                imagesData[dataKey] = reader.result;
                document.getElementById(previewId).innerHTML = `<img src="${reader.result}" class="preview-img">`;
            }
            reader.readAsDataURL(file);
        }

        // الاستماع للميكروفون
        function startDictation(inputId, btnElement) {
            if (window.hasOwnProperty('webkitSpeechRecognition') || window.hasOwnProperty('SpeechRecognition')) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                var recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = "ar-EG";
                
                recognition.onstart = function() {
                    btnElement.classList.add('recording');
                    document.getElementById(inputId).placeholder = "رويال مايند تستمع إليكِ الآن... تحدثي";
                };

                recognition.onresult = function(e) {
                    document.getElementById(inputId).value += " " + e.results[0][0].transcript;
                    recognition.stop();
                };

                recognition.onerror = function(e) { 
                    recognition.stop(); 
                };
                
                recognition.onend = function() {
                    btnElement.classList.remove('recording');
                    document.getElementById(inputId).placeholder = "اكتبي أو تحدثي لرويال مايند...";
                };

                recognition.start();
            } else {
                alert("عذراً، متصفحك لا يدعم خاصية الإدخال الصوتي التلقائي.");
            }
        }

        function handleFileUpload(event, inputId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                let currentVal = document.getElementById(inputId).value;
                document.getElementById(inputId).value = currentVal + "\n\n[ملف مرفق للتحليل]:\n" + text;
                alert("تم إرفاق السجل بنجاح، يمكنك الآن بدء التحليل.");
            };
            reader.readAsText(file);
        }

        // ===================================
        // النطق الصوتي للردود (Text to Speech)
        // ===================================
        function playVoice(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // إيقاف أي صوت سابق
                // إزالة العلامات الخاصة بالبرمجة ليكون النطق نظيفاً
                let cleanText = text.replace(/<[^>]*>?/gm, '').replace(/[\*#]/g, '');
                
                let utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ar-SA'; // لغة عربية
                utterance.rate = 0.85; // إبطاء السرعة قليلاً لتعطي فخامة في الحديث
                window.speechSynthesis.speak(utterance);
            } else {
                alert("متصفحك لا يدعم خاصية النطق الصوتي.");
            }
        }

        // دالة مساعدة لإنشاء زر الصوت مع الرد
        function formatResponseWithVoice(text) {
            // نمرر النص كمتغير مشفر حتى لا يحدث تضارب مع علامات التنصيص
            let encodedText = encodeURIComponent(text);
            return `<div class="mb-3">${text}</div>
                    <button class="play-voice-btn" onclick="playVoice(decodeURIComponent('${encodedText}'))">
                        <i class="fa-solid fa-volume-high"></i> استمع للرد الملكي
                    </button>`;
        }

        async function runDiagnosis() {
            let mood = document.getElementById('qMood').value;
            let out = document.getElementById('diagResponse');
            out.style.display = 'block'; out.innerHTML = "<span class='gold-text'>رويال مايند تقرأ روحكِ...</span>";
            try {
                let res = await fetch(`${BACKEND_URL}/api/diagnose`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ mood_answers: {"الحالة": mood}, image: null })
                });
                let data = await res.json();
                if(data.status === 'success') {
                    out.innerHTML = formatResponseWithVoice(data.diagnosis);
                    saveToVault('تحليل الهالة', data.diagnosis);
                } else out.innerHTML = `<span class="text-danger">خطأ: ${JSON.stringify(data)}</span>`;
            } catch(e) { out.innerHTML = `<span class="text-danger">خطأ اتصال: ${e.message}</span>`; }
        }

        async function runChat(category, inputId, outId) {
            let text = document.getElementById(inputId).value;
            let out = document.getElementById(outId);
            if(!text) return;
            out.style.display = 'block'; out.innerHTML = "<span class='gold-text'>يتم استخلاص الجمال وتأثيره...</span>";
            try {
                let res = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ text: text, category: category, image: null })
                });
                let data = await res.json();
                if(data.status === 'success') {
                    out.innerHTML = formatResponseWithVoice(data.answer);
                    saveToVault(`استشارة ${category}`, data.answer);
                } else out.innerHTML = `<span class="text-danger">خطأ: ${JSON.stringify(data)}</span>`;
            } catch(e) { out.innerHTML = `<span class="text-danger">خطأ اتصال: ${e.message}</span>`; }
        }

        async function runSimulation() {
            if(!imagesData.selfieBase64 || !imagesData.productBase64) return alert("يجب رفع الصورتين.");
            let name = document.getElementById('simProductName').value || "منتج فاخر";
            let out = document.getElementById('simResponse');
            out.style.display = 'block'; out.innerHTML = "<span class='gold-text'>رويال مايند تتخيل الأثر الساحر...</span>";
            try {
                let res = await fetch(`${BACKEND_URL}/api/simulate_makeup`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_selfie: imagesData.selfieBase64, product_image: imagesData.productBase64, product_name_desc: name })
                });
                let data = await res.json();
                if(data.status === 'success') {
                    out.innerHTML = formatResponseWithVoice(data.simulation_result);
                    saveToVault('التخيل الجمالي', data.simulation_result, imagesData.selfieBase64);
                } else out.innerHTML = `<span class="text-danger">خطأ داخلي.</span>`;
            } catch(e) { out.innerHTML = `<span class="text-danger">فشل الاتصال.</span>`; }
        }

        function saveToVault(type, text, img=null) {
            let vault = JSON.parse(localStorage.getItem('royal_vault_data') || "[]");
            vault.unshift({ date: new Date().toLocaleString('ar-EG'), type, text, img });
            localStorage.setItem('royal_vault_data', JSON.stringify(vault));
            renderVault();
        }

        function renderVault() {
            let vault = JSON.parse(localStorage.getItem('royal_vault_data') || "[]");
            let cont = document.getElementById('vaultContainer');
            if(!vault.length) return cont.innerHTML = "<p class='text-center text-muted'>السجلات الملكية فارغة.</p>";
            cont.innerHTML = vault.map(i => `
                <div class="p-3 mb-3" style="background:rgba(0,0,0,0.5); border-right:3px solid #d4af37; border-radius:5px;">
                    <div class="d-flex justify-content-between gold-text small mb-2"><span>${i.type}</span><span>${i.date}</span></div>
                    <div class="text-light small" style="white-space:pre-line;">${i.text.substring(0, 150)}...</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
