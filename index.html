<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Elchim - القصر الجمالي المتكامل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        body { 
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #d4fc79, #96e6a1, #fff1eb, #f1eefc); 
            background-size: 300% 300%; animation: aurora 12s ease infinite; 
            color: #1a1a2e; font-family: 'Times New Roman', serif; 
        }
        .gold-text { color: #b58900; font-weight: bold; }
        .gold-border { border: 2px solid #b58900; border-radius: 15px; }
        .vault-img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
        .result-ar-img { max-width: 100%; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    </style>
</head>
<body class="container py-4">

    <header class="text-center mb-5">
        <h1 class="display-4 gold-text">ROYAL ELCHIM</h1>
        <p class="lead">محرك الفخامة والذكاء الجمالي</p>
    </header>

    <div class="row">
        <div class="col-md-7">
            <div class="card p-4 shadow-sm gold-border mb-4">
                <h3 class="gold-text mb-3"><i class="fas fa-magic"></i> قسم التخيل الملكي (AR)</h3>
                <div class="mb-3">
                    <label class="form-label">صورة السيلفي الشخصية:</label>
                    <input type="file" id="selfieInput" class="form-control" accept="image/*">
                </div>
                <div class="mb-3">
                    <label class="form-label">صورة المنتج (اختياري):</label>
                    <input type="file" id="productInput" class="form-control" accept="image/*">
                </div>
                <button class="btn btn-dark w-100 py-2" onclick="runRoyalSimulation()">تطبيق التأثير الجمالي</button>
                <div id="simulationResult" class="mt-4"></div>
            </div>

            <div class="card p-4 shadow-sm mb-4">
                <h4 class="gold-text"><i class="fas fa-comments"></i> المستشار الملكي الذكي</h4>
                <div id="chatBox" class="mb-3 border p-2" style="height: 300px; overflow-y: auto; background: rgba(255,255,255,0.7);"></div>
                <div class="input-group">
                    <input type="text" id="chatInput" class="form-control" placeholder="اسأل عن أي منتج أو نصيحة جمالية...">
                    <button class="btn btn-gold" onclick="sendRoyalChat()">إرسال</button>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card p-4 shadow-sm" style="background: rgba(255,255,255,0.8);">
                <h4 class="gold-text border-bottom pb-2">السجلات الملكية (آخر 5 تجارب)</h4>
                <div id="vaultContainer"></div>
                
                <div id="keySection" class="mt-4 p-3 border rounded bg-light" style="display: none;">
                    <p class="small text-danger fw-bold">لقد وصلت للحد الأقصى للتجارب المجانية!</p>
                    <input type="text" id="geminiKey" class="form-control mb-2" placeholder="أدخل مفتاح API الخاص بك">
                    <button class="btn btn-success btn-sm w-100" onclick="activateKey()">تفعيل المفتاح الخاص</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const MAX_FREE = 6;
        const MAX_VAULT = 5;

        // دالة تحويل الصورة لـ Base64
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // تشغيل المحاكاة (AR)
        async function runRoyalSimulation() {
            const usage = parseInt(localStorage.getItem('royal_usage') || "0");
            const hasKey = localStorage.getItem('royal_user_key');

            if (usage >= MAX_FREE && !hasKey) {
                document.getElementById('keySection').style.display = 'block';
                alert("يرجى تفعيل مفتاحك الخاص للاستمرار بعد 6 تجارب.");
                return;
            }

            const sFile = document.getElementById('selfieInput').files[0];
            const pFile = document.getElementById('productInput').files[0];
            if (!sFile) return alert("يرجى رفع صورتك الشخصية أولاً.");

            const sBase = await toBase64(sFile);
            const pBase = pFile ? await toBase64(pFile) : null;

            // استدعاء الـ API
            const resp = await fetch('/api/simulate_makeup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    user_selfie: sBase,
                    product_image: pBase,
                    client_api_key: hasKey || ""
                })
            });

            const data = await resp.json();
            if(data.status === 'success') {
                // حفظ في السجلات (الصور)
                saveToVault(sBase, data.result_image);
                // تحديث العداد
                if(!hasKey) localStorage.setItem('royal_usage', usage + 1);
                
                document.getElementById('simulationResult').innerHTML = `
                    <img src="${data.result_image}" class="result-ar-img">
                    <p class="mt-2 text-center small text-muted">تم تطبيق تأثير الواقع المعزز بنجاح</p>`;
            }
        }

        function saveToVault(selfie, result) {
            let vault = JSON.parse(localStorage.getItem('royal_vault') || "[]");
            const entry = { id: Date.now(), date: new Date().toLocaleString('ar-EG'), selfie, result };
            vault.unshift(entry);
            if (vault.length > MAX_VAULT) vault = vault.slice(0, MAX_VAULT);
            localStorage.setItem('royal_vault', JSON.stringify(vault));
            renderVault();
        }

        function renderVault() {
            const vault = JSON.parse(localStorage.getItem('royal_vault') || "[]");
            const cont = document.getElementById('vaultContainer');
            cont.innerHTML = vault.map(i => `
                <div class="mb-3 p-2 border-bottom">
                    <small class="d-block text-muted mb-1">${i.date}</small>
                    <div class="d-flex gap-2">
                        <img src="${i.selfie}" class="vault-img">
                        <i class="fas fa-long-arrow-alt-left pt-3"></i>
                        <img src="${i.result}" class="vault-img border-gold">
                    </div>
                </div>`).join('');
        }

        function activateKey() {
            const key = document.getElementById('geminiKey').value;
            if (key.startsWith("AIza")) {
                localStorage.setItem('royal_user_key', key);
                alert("تم التفعيل! البرنامج يعمل الآن بمفتاحك الخاص.");
                location.reload();
            }
        }

        // تحميل السجلات عند البداية
        renderVault();
    </script>
</body>
</html>
