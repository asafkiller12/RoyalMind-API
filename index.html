<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Elchim - القصر الجمالي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        body { background: linear-gradient(135deg, #0b0914, #2a113b, #0f2027, #3a1c2a, #0b0914); background-size: 400% 400%; animation: aurora 15s ease infinite; color: #e6e6e6; font-family: 'Times New Roman', serif; padding-bottom: 80px; min-height: 100vh; }
        .gold-text { color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        .glass-card { background: rgba(15, 10, 25, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .gold-btn { background: linear-gradient(45deg, #d4af37, #f3e5ab, #d4af37); color: #0b0914; font-weight: bold; border: none; border-radius: 8px; padding: 10px; transition: 0.3s; width: 100%; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 5, 15, 0.95); border-top: 1px solid #d4af37; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { text-align: center; color: #888; cursor: pointer; flex: 1; font-size: 0.8rem; }
        .nav-item i { font-size: 1.4rem; display: block; margin-bottom: 2px; }
        .nav-item.active { color: #d4af37; }
        .app-screen { display: none; }
        .app-screen.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .status-badge { border-radius: 20px; padding: 2px 10px; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div class="container pt-4 text-center">
        <img src="Untitled-2_2.jpg" alt="Logo" style="max-width: 120px; mix-blend-mode: screen;">
        <p class="small text-muted">جمال يترك أثراً، وحضور يولد الحب</p>
    </div>

    <div class="container">
        <div id="screen-search" class="app-screen active">
            <div class="glass-card">
                <h4 class="gold-text mb-3 text-center">الاستعلام الملكي السريع</h4>
                <div class="input-group mb-3">
                    <input type="text" id="searchInput" class="form-control bg-dark text-light border-secondary text-center" placeholder="اسم المنتج أو الباركود..." oninput="doSearch(this.value)">
                </div>
                <div id="results"></div>
            </div>
        </div>

        <div id="screen-diagnosis" class="app-screen">
            <div class="glass-card text-center">
                <h4 class="gold-text mb-4">قراءة الروح</h4>
                <button class="gold-btn" onclick="startDiagnosis()">تحليل الهالة الآن</button>
                <div id="diagResponse" class="mt-3 small text-end" style="white-space: pre-wrap; line-height: 1.8;"></div>
            </div>
        </div>

        <div id="screen-perfume" class="app-screen">
            <div class="glass-card text-center">
                <h4 class="gold-text mb-4">الأثر العطري</h4>
                <textarea id="perfumeInput" class="form-control bg-dark text-light border-secondary mb-3" rows="3" placeholder="تحدثي عما يجول بخاطركِ لعطوركِ..."></textarea>
                <button class="gold-btn" onclick="runChat('perfume', 'perfumeInput', 'perfumeResponse')">ابتكار التوقيع العطري</button>
                <div id="perfumeResponse" class="mt-3 small text-end" style="white-space: pre-wrap; line-height: 1.8;"></div>
            </div>
        </div>

        <div id="screen-makeup" class="app-screen">
            <div class="glass-card text-center">
                <h4 class="gold-text mb-4">النحت الجمالي</h4>
                <textarea id="makeupInput" class="form-control bg-dark text-light border-secondary mb-3" rows="3" placeholder="صفي لنا الإطلالة التي تطمحين إليها..."></textarea>
                <button class="gold-btn" onclick="runChat('makeup', 'makeupInput', 'makeupResponse')">استشارة النحت والجمال</button>
                <div id="makeupResponse" class="mt-3 small text-end" style="white-space: pre-wrap; line-height: 1.8;"></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('search', this)"><i class="fa-solid fa-search"></i><span>الاستعلام</span></div>
        <div class="nav-item" onclick="switchTab('diagnosis', this)"><i class="fa-solid fa-eye"></i><span>القراءة</span></div>
        <div class="nav-item" onclick="switchTab('perfume', this)"><i class="fa-solid fa-spray-can"></i><span>العطور</span></div>
        <div class="nav-item" onclick="switchTab('makeup', this)"><i class="fa-solid fa-lips"></i><span>المكياج</span></div>
    </div>

    <script>
        const BACKEND_URL = "https://royalmind-api-production-2448.up.railway.app";
        let timer;

        function switchTab(id, el) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + id).classList.add('active');
            el.classList.add('active');
        }

        // تنسيق الروابط لتصبح أزرار
        function formatLinks(text) {
            const urlRegex = /(https?:\/\/[^\s\]\)\*]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<br><a href="${url}" target="_blank" class="btn gold-btn mt-2 mb-2 px-4 btn-sm" style="display:inline-block; text-decoration:none;"><i class="fa-solid fa-bag-shopping"></i> اقتناء المنتج</a><br>`;
            });
        }

        function doSearch(val) {
            clearTimeout(timer);
            if(val.length < 2) return;
            timer = setTimeout(async () => {
                const resDiv = document.getElementById('results');
                resDiv.innerHTML = "<p class='text-center gold-text small'>جاري البحث في السجلات...</p>";
                try {
                    const r = await fetch(`${BACKEND_URL}/api/search?query=${val}`);
                    const json = await r.json();
                    if(json.data && json.data.length > 0) {
                        resDiv.innerHTML = json.data.map(item => `
                            <div class="p-3 mb-2" style="background:rgba(0,0,0,0.2); border-radius:10px; border-right:3px solid var(--bs-${item.color}); text-align: right;">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="fw-bold" style="font-size:0.9rem;">${item.name}</span>
                                    <span class="badge bg-${item.color} status-badge">${item.status}</span>
                                </div>
                                <div class="d-flex justify-content-between mt-2 align-items-center">
                                    <span class="gold-text fw-bold">${item.price} ج.م</span>
                                    <a href="${item.link}" target="_blank" class="btn btn-sm gold-btn" style="width: auto; padding: 5px 15px;">عرض <i class="fa-solid fa-arrow-left"></i></a>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        resDiv.innerHTML = "<p class='text-center small'>لا توجد نتائج مطابقة.</p>";
                    }
                } catch(e) { resDiv.innerHTML = "<p class='text-center text-danger small'>خطأ في الاتصال.</p>"; }
            }, 500);
        }

        async function startDiagnosis() {
            const out = document.getElementById('diagResponse');
            out.innerHTML = "رويال مايند تقرأ روحكِ...";
            try {
                const r = await fetch(`${BACKEND_URL}/api/diagnose`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({mood_answers: {"الحالة": "حدث استثنائي"}})
                });
                const data = await r.json();
                if(data.status === 'success') out.innerHTML = formatLinks(data.diagnosis);
            } catch { out.innerHTML = "خطأ في الاتصال"; }
        }

        async function runChat(category, inputId, outId) {
            let text = document.getElementById(inputId).value;
            let out = document.getElementById(outId);
            if(!text) return;
            out.innerHTML = "يتم استخلاص الجمال وتأثيره...";
            try {
                let res = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ text: text, category: category })
                });
                let data = await res.json();
                if(data.status === 'success') out.innerHTML = formatLinks(data.answer);
            } catch { out.innerHTML = "خطأ اتصال."; }
        }
    </script>
</body>
</html>
