<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Elchim - الإدارة الملكية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        body { background: linear-gradient(135deg, #0b0914, #2a113b, #0f2027, #3a1c2a, #0b0914); background-size: 400% 400%; animation: aurora 15s ease infinite; color: #e6e6e6; font-family: 'Times New Roman', serif; padding-bottom: 80px; min-height: 100vh; }
        .gold-text { color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        .glass-card { background: rgba(15, 10, 25, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .gold-btn { background: linear-gradient(45deg, #d4af37, #f3e5ab, #d4af37); color: #0b0914; font-weight: bold; border: none; transition: 0.3s; }
        .gold-btn:hover { background: #f3e5ab; color: #000; transform: scale(1.01); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 5, 15, 0.9); border-top: 1px solid #d4af37; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { text-align: center; color: #888; cursor: pointer; flex: 1; transition: 0.3s; }
        .nav-item i { font-size: 1.4rem; display: block; margin-bottom: 2px; }
        .nav-item.active { color: #d4af37; transform: translateY(-3px); }
        .app-screen { display: none; animation: fadeIn 0.5s; }
        .app-screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .status-badge { border-radius: 20px; padding: 4px 12px; font-size: 0.75rem; font-weight: bold; }
        .royal-response { background: rgba(212, 175, 55, 0.05); border-top: 1px solid #d4af37; border-bottom: 1px solid #d4af37; padding: 15px; margin-top: 15px; white-space: pre-line; text-align: right; }
        .input-toolbar { display: flex; gap: 15px; margin-top: -10px; margin-bottom: 15px; justify-content: flex-end; }
        .icon-btn { background: none; border: none; color: #d4af37; font-size: 1.2rem; cursor: pointer; }
        .recording { color: #ff4d4d; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .play-voice-btn { background: #d4af37; color: #0b0914; border: none; border-radius: 4px; padding: 4px 12px; font-weight: bold; margin-top: 10px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="container pt-4 text-center">
        <img src="Untitled-2_2.jpg" alt="Royal Elchim" style="max-width: 150px; mix-blend-mode: screen;">
        <h5 class="gold-text mt-2">نظام الإدارة الفاخر الموحد</h5>
    </div>

    <div class="container mt-4">
        <div id="screen-search" class="app-screen active">
            <div class="glass-card">
                <h3 class="gold-text mb-3 text-center"><i class="fa-solid fa-barcode"></i> الاستعلام الملكي</h3>
                <div class="input-group mb-3">
                    <input type="text" id="royalSearchInput" class="form-control bg-dark text-light border-secondary text-center" 
                           placeholder="ادخلي اسم المنتج أو امسحي الباركود..." oninput="debounceSearch(this.value)">
                    <button class="btn gold-btn"><i class="fa-solid fa-search"></i></button>
                </div>
                <div id="searchResultsContainer"></div>
            </div>
        </div>

        <div id="screen-diagnosis" class="app-screen">
            <div class="glass-card">
                <h3 class="gold-text mb-3 text-center"><i class="fa-solid fa-eye"></i> قراءة الروح</h3>
                <div class="mb-3">
                    <label class="gold-text mb-2">طاقتكِ ومزاجكِ الحالي:</label>
                    <select id="qMood" class="form-select bg-dark text-light border-secondary">
                        <option value="استعد لحدث استثنائي وأريد حضوراً يخطف الأنفاس">أستعد لحدث استثنائي وأريد حضوراً يخطف الأنفاس ويولد الانبهار</option>
                        <option value="أريد أن أستكشف جانباً جديداً وغامضاً في شخصيتي">أبحث عن جمال هادئ يترك أثراً لا يُنسى</option>
                    </select>
                </div>
                <button class="btn gold-btn w-100 py-2" onclick="runDiagnosis()">تحليل الهالة الملكية</button>
                <div id="diagResponse" class="royal-response" style="display:none;"></div>
            </div>
        </div>

        <div id="screen-perfume" class="app-screen">
            <div class="glass-card">
                <h3 class="gold-text mb-3 text-center"><i class="fa-solid fa-spray-can-sparkles"></i> الأثر العطري</h3>
                <textarea id="perfumeInput" class="form-control bg-dark text-light border-secondary mb-3" rows="3" placeholder="تحدثي عما يجول بخاطركِ لعطوركِ..."></textarea>
                <div class="input-toolbar">
                    <button class="icon-btn" onclick="startDictation('perfumeInput', this)"><i class="fa-solid fa-microphone"></i></button>
                </div>
                <button class="btn gold-btn w-100 py-2" onclick="runChat('perfume', 'perfumeInput', 'perfumeResponse')">ابتكار التوقيع العطري</button>
                <div id="perfumeResponse" class="royal-response" style="display:none;"></div>
            </div>
        </div>

        <div id="screen-makeup" class="app-screen">
            <div class="glass-card">
                <h3 class="gold-text mb-3 text-center"><i class="fa-solid fa-paintbrush"></i> النحت الجمالي</h3>
                <textarea id="makeupInput" class="form-control bg-dark text-light border-secondary mb-3" rows="3" placeholder="صفي لنا الإطلالة التي تطمحين إليها..."></textarea>
                <div class="input-toolbar">
                    <button class="icon-btn" onclick="startDictation('makeupInput', this)"><i class="fa-solid fa-microphone"></i></button>
                </div>
                <button class="btn gold-btn w-100 py-2" onclick="runChat('makeup', 'makeupInput', 'makeupResponse')">استشارة النحت والجمال</button>
                <div id="makeupResponse" class="royal-response" style="display:none;"></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('search', this)"><i class="fa-solid fa-search"></i><span>الاستعلام</span></div>
        <div class="nav-item" onclick="switchTab('diagnosis', this)"><i class="fa-solid fa-eye"></i><span>قراءة</span></div>
        <div class="nav-item" onclick="switchTab('perfume', this)"><i class="fa-solid fa-spray-can"></i><span>عطور</span></div>
        <div class="nav-item" onclick="switchTab('makeup', this)"><i class="fa-solid fa-wand-magic"></i><span>مكياج</span></div>
    </div>

    <script>
        const BACKEND_URL = "https://royalmind-api-production-2448.up.railway.app";
        let searchTimer;

        // تفعيل مسبق للأصوات في المتصفح
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        function switchTab(id, el) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + id).classList.add('active');
            el.classList.add('active');
        }

        function debounceSearch(val) {
            clearTimeout(searchTimer);
            if(val.length < 2) return;
            searchTimer = setTimeout(() => performRoyalSearch(val), 500);
        }

        async function performRoyalSearch(query) {
            const container = document.getElementById('searchResultsContainer');
            container.innerHTML = "<p class='text-center gold-text'><i class='fa-solid fa-spinner fa-spin'></i> جاري فحص الخزينة الملكية...</p>";
            try {
                const res = await fetch(`${BACKEND_URL}/api/search?query=${encodeURIComponent(query)}`);
                const result = await res.json();
                if(result.status === 'success' && result.data.length > 0) {
                    container.innerHTML = result.data.map(item => `
                        <div class="glass-card mb-2 p-3" style="border-right: 4px solid var(--bs-${item.color}); text-align: right;">
                            <div class="d-flex justify-content-between">
                                <span class="gold-text fw-bold" style="font-size:1.1rem;">${item.name}</span>
                                <span class="badge bg-${item.color} status-badge">${item.status}</span>
                            </div>
                            <div class="d-flex justify-content-between mt-3 align-items-center">
                                <div>
                                    <small class="text-muted d-block">باركود: ${item.barcode}</small>
                                    <span class="h5 gold-text">${item.price} ج.م</span>
                                </div>
                                ${convertLinkToButton(item.link)}
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = "<p class='text-center text-muted p-3'>هذا الأثر غير متوفر في مخازننا حالياً.</p>";
                }
            } catch(e) {
                container.innerHTML = "<p class='text-center text-danger'>اضطراب في الاتصال بالسيرفر.</p>";
            }
        }

        function convertLinkToButton(url) {
            if(!url || url === "#" || url.includes("https://www.royalelchim.app") === false) return "";
            return `<a href="${url}" target="_blank" class="btn btn-sm gold-btn py-2 px-3" style="text-shadow:none;"><i class="fa-solid fa-bag-shopping"></i> اقتناء الآن</a>`;
        }

        function convertTextLinksToButtons(text) {
            const urlRegex = /(https?:\/\/[^\s\]\)\*]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<br><a href="${url}" target="_blank" class="btn gold-btn mt-2 mb-2 px-4 btn-sm" style="display:inline-block; text-decoration:none; text-shadow:none;"><i class="fa-solid fa-bag-shopping"></i> اقتناء المنتج عبر الرابط الملكي</a><br>`;
            });
        }

        function playVoice(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let cleanText = text.replace(/<[^>]*>?/gm, '').replace(/[\*#]/g, '').replace(/(https?:\/\/[^\s]+)/g, 'تم إرفاق الرابط بالأسفل.');
                let utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.85;
                let voices = window.speechSynthesis.getVoices();
                let arVoice = voices.find(v => v.lang.includes('ar') || v.lang.includes('AR'));
                if(arVoice) utterance.voice = arVoice;
                window.speechSynthesis.speak(utterance);
            }
        }

        function formatResponse(text) {
            let richHtml = convertTextLinksToButtons(text);
            let encoded = encodeURIComponent(text);
            return `<div>${richHtml}</div><button class="play-voice-btn" onclick="playVoice(decodeURIComponent('${encoded}'))"><i class="fa-solid fa-volume-high"></i> استمع للرد الملكي</button>`;
        }

        async function runDiagnosis() {
            let mood = document.getElementById('qMood').value;
            let out = document.getElementById('diagResponse');
            out.style.display = 'block'; out.innerHTML = "رويال مايند تقرأ هالتكِ...";
            try {
                let res = await fetch(`${BACKEND_URL}/api/diagnose`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ mood_answers: {"الحالة": mood} })
                });
                let data = await res.json();
                if(data.status === 'success') out.innerHTML = formatResponse(data.diagnosis);
            } catch { out.innerHTML = "خطأ في معالجة البيانات."; }
        }

        async function runChat(category, inputId, outId) {
            let text = document.getElementById(inputId).value;
            let out = document.getElementById(outId);
            if(!text) return;
            out.style.display = 'block'; out.innerHTML = "يتم استخلاص الجمال وتأثيره...";
            try {
                let res = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ text: text, category: category })
                });
                let data = await res.json();
                if(data.status === 'success') out.innerHTML = formatResponse(data.answer);
            } catch { out.innerHTML = "خطأ اتصال."; }
        }

        function startDictation(inputId, btn) {
            if (window.hasOwnProperty('webkitSpeechRecognition')) {
                var recognition = new webkitSpeechRecognition();
                recognition.lang = "ar-EG";
                recognition.onstart = function() { btn.classList.add('recording'); };
                recognition.onresult = function(e) { document.getElementById(inputId).value += " " + e.results[0][0].transcript; };
                recognition.onend = function() { btn.classList.remove('recording'); };
                recognition.start();
            }
        }
    </script>
</body>
</html>
